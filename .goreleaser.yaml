version: 2
project_name: nokkud
report_sizes: true

before:
  hooks:
    - go fmt ./...
    - go vet ./...
    - go test ./...
    - go mod download
    - go mod verify

builds:
  - binary: "{{ .ProjectName }}"
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/mizuchilabs/kata/buildinfo.Version={{ .Version }}
      - -X github.com/mizuchilabs/kata/buildinfo.Commit={{ .Commit }}
      - -X github.com/mizuchilabs/kata/buildinfo.Date={{ .CommitDate }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - riscv64

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

sboms:
  - cmd: syft
    documents:
      - "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}.sbom.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document"]
    artifacts: binary

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: packaging/systemd/nokkud.service
        dst: nokkud.service
      - src: packaging/openrc/nokkud.openrc
        dst: nokkud.openrc # needs to be renamed for OpenRC
      - src: packaging/apparmor/usr.bin.nokkud
        dst: usr.bin.nokkud
      - src: packaging/selinux/nokkud.pp
        dst: nokkud.pp
      - src: packaging/ufw/nokkud
        dst: nokkud.ufw
      - src: packaging/firewalld/nokkud.xml
        dst: nokkud.firewalld.xml
      - src: packaging/install.sh
        dst: install.sh

nfpms:
  - vendor: "MizuchiLabs"
    homepage: "https://github.com/nokku-sh/nokkud"
    description: "Nokku Daemon - SSH certificate management daemon"
    maintainer: "Nokku <support@mizuchi.dev>"
    license: Apache-2.0
    bindir: /usr/bin
    formats:
      - apk
      - deb
      - rpm
    dependencies:
      - openssh
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh
    contents:
      - src: packaging/systemd/nokkud.service
        dst: /usr/share/nokkud/systemd/nokkud.service
      - src: packaging/openrc/nokkud.openrc
        dst: /usr/share/nokkud/openrc/nokkud.openrc
      - src: packaging/apparmor/usr.bin.nokkud
        dst: /usr/share/nokkud/apparmor/usr.bin.nokkud
      - src: packaging/selinux/nokkud.pp
        dst: /usr/share/nokkud/selinux/nokkud.pp
      - src: packaging/ufw/nokkud
        dst: /usr/share/nokkud/ufw/nokkud
      - src: packaging/firewalld/nokkud.xml
        dst: /usr/share/nokkud/firewalld/nokkud.xml

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

source:
  enabled: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  draft: false
  replace_existing_draft: true
  replace_existing_artifacts: true
  mode: append

changelog:
  disable: true
