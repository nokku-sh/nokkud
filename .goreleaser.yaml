version: 2
project_name: nokkud
report_sizes: true

before:
  hooks:
    - go fmt ./...
    - go vet ./...
    - go test ./...
    - go mod download
    - go mod verify

builds:
  - binary: "{{ .ProjectName }}"
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/mizuchilabs/kata/buildinfo.Version={{ .Version }}
      - -X github.com/mizuchilabs/kata/buildinfo.Commit={{ .Commit }}
      - -X github.com/mizuchilabs/kata/buildinfo.Date={{ .CommitDate }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - riscv64

dockers_v2:
  - images: [ghcr.io/nokku-sh/nokkud]
    dockerfile: Dockerfile
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "The Nokku daemon, for containers you want to SSH into"
      org.opencontainers.image.source: "https://github.com/nokku-sh/nokkud"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: "Apache-2.0"

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

docker_signs:
  - cmd: cosign
    artifacts: manifests
    args:
      - "sign"
      - "${artifact}@${digest}"
      - "--yes"

sboms:
  - cmd: syft
    documents:
      - "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}.sbom.json"
    args:
      - "$artifact"
      - "--source-name={{ .ProjectName }}"
      - "--source-version={{ .Version }}"
      - "--select-catalogers=-file"
      - "--output"
      - "cyclonedx-json=$document"
    artifacts: binary

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: packaging/systemd/nokkud.service
        dst: nokkud.service
      - src: packaging/openrc/nokkud.openrc
        dst: nokkud.openrc # needs to be renamed for OpenRC
      - src: packaging/ufw/nokkud
        dst: nokkud.ufw
      - src: packaging/firewalld/nokkud.xml
        dst: nokkud.firewalld.xml
      - src: packaging/install.sh
        dst: install.sh
      - src: packaging/scripts/postinstall.sh
        dst: postinstall.sh

nfpms:
  - vendor: "MizuchiLabs"
    homepage: "https://github.com/nokku-sh/nokkud"
    description: "Nokku Daemon - SSH certificate management daemon"
    maintainer: "Nokku <support@mizuchi.dev>"
    license: Apache-2.0
    bindir: /usr/bin
    formats:
      - apk
      - deb
      - rpm
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh
    contents:
      - src: packaging/systemd/nokkud.service
        dst: /usr/share/nokkud/systemd/nokkud.service
      - src: packaging/openrc/nokkud.openrc
        dst: /usr/share/nokkud/openrc/nokkud.openrc
      - src: packaging/ufw/nokkud
        dst: /usr/share/nokkud/ufw/nokkud
      - src: packaging/firewalld/nokkud.xml
        dst: /usr/share/nokkud/firewalld/nokkud.xml

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

source:
  enabled: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  draft: false
  replace_existing_draft: true
  replace_existing_artifacts: true
  mode: append
