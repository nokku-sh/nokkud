version: "3"

env:
  CGO_ENABLED: 0

tasks:
  update:
    desc: Update dependencies
    cmds:
      - go get -u ./...

  gen:
    desc: Generate buf.build files
    cmds:
      - buf generate

  selinux:
    desc: Generate selinux policy
    dir: ./packaging/selinux/
    cmds:
      - make -f /usr/share/selinux/devel/Makefile nokkud.pp

  build:
    desc: Build binary
    cmds:
      - go build -ldflags="-s -w" -trimpath -o nokkud
      - sudo mv nokkud /usr/local/bin

  lint:
    desc: Run go vet & lint
    cmds:
      - go mod tidy
      - go fmt ./...
      - go vet ./...
      - govulncheck ./...
      - go test -cover ./...
      - golangci-lint run --fix

  fuzz:
    desc: Fuzz every fuzz target for FUZZTIME (default 30s)
    vars:
      FUZZTIME: '{{.FUZZTIME | default "30s"}}'
    cmds:
      - |
        for pkg in $(go list ./...); do
          for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz'); do
            go test "$pkg" -run='^$' -fuzz="^${target}$" -fuzztime="{{.FUZZTIME}}"
          done
        done

  snapshot:
    desc: Build snapshot
    cmds:
      - goreleaser --snapshot --clean --skip=validate,sign,sbom,archive
